app.querySelector(".reset").onclick=reset;const r=app.querySelector(".reason");r.oninput=function(){state.reasons[q.n]=r.value;save()};app.querySelectorAll(".choice").forEach(function(b){b.onclick=function(){if(advancing)return;advancing=true;state.reasons[q.n]=r.value;state.answers[q.n]=b.dataset.s;save();app.querySelectorAll(".choice").forEach(function(x){x.disabled=true});b.classList.add("selected");setTimeout(render,200)}})}
function snip(t){t=t.replace(/\s+/g," ").trim();return t.length>40?t.slice(0,40)+"…":t}
function ratio(q){const h=q[q.ans].likes,l=q[q.ans==="A"?"B":"A"].likes;return h.toLocaleString("ja-JP")+" vs "+l.toLocaleString("ja-JP")+"＝"+(h/l).toFixed(1)+"倍"}
